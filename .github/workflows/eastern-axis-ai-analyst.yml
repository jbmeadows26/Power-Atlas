name: Eastern Axis intelligence analyst
on:
  schedule:
    - cron: '17 06 * * *'
  workflow_dispatch:
    inputs:
      research:
        type: boolean
        default: false
        description: 'Manually run configured AI models into unreviewed public-source artifacts'
      query:
        type: string
        required: false
        description: 'Intelligence research question'
      free_model:
        type: boolean
        default: true
        description: 'Run free, ephemeral Ollama CPU model; no paid API credentials'
  pull_request:
    paths:
      - 'eastern-axis/src/AgentDesk.tsx'
      - 'eastern-axis/scripts/agent_pipeline.py'
      - 'eastern-axis/scripts/analyst_briefs.py'
      - 'eastern-axis/tests/test_agent_pipeline.py'
      - '.github/workflows/eastern-axis-ai-analyst.yml'
  push:
    branches: [main]
    paths:
      - 'eastern-axis/scripts/agent_pipeline.py'
      - 'eastern-axis/scripts/analyst_briefs.py'
      - 'eastern-axis/tests/test_agent_pipeline.py'
      - '.github/workflows/eastern-axis-ai-analyst.yml'
permissions:
  contents: write
concurrency:
  group: ea-source-first-analyst
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed source validation
        run: python -m unittest discover -s eastern-axis/tests -p 'test_agent_pipeline.py' -v
      - name: Install free local semantic embeddings for scheduled research
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python -m pip install 'fastembed>=0.7,<1' || echo 'FastEmbed unavailable: source-only keyword fallback will be clearly labeled.'
      - name: Install keyless passive OpenOSINT MCP
        run: python -m pip install "mcp>=1,<3" "uv>=0.7,<2"
      - name: Install GPT Researcher and free DuckDuckGo retriever only for requested research
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.research) || (github.event_name == 'pull_request' && github.head_ref == 'feature/eastern-axis-keyless-provider-provisioning-20261118') }}
        run: python -m pip install 'gpt-researcher>=0.15,<1' 'ddgs>=9,<11'
      - name: Install authenticated Local Deep Research client only when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.research && vars.EA_LDR_URL != '' }}
        run: python -m pip install 'local-deep-research>=1,<3'
      - name: Start free, isolated Ollama CPU model on the ephemeral runner
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.research && inputs.free_model) || (github.event_name == 'pull_request' && github.head_ref == 'feature/eastern-axis-keyless-provider-provisioning-20261118') }}
        run: |
          docker run --detach --name eastern-axis-ollama \
            -e OLLAMA_HOST=0.0.0.0:11434 \
            -e OLLAMA_NUM_PARALLEL=1 \
            --publish 127.0.0.1:11434:11434 ollama/ollama:latest
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          docker exec eastern-axis-ollama ollama pull qwen2.5:1.5b
          docker exec eastern-axis-ollama ollama pull nomic-embed-text
      - name: Run source digest and optionally create review drafts
        env:
          EA_OPENOSINT_DOMAIN: ${{ vars.EA_OPENOSINT_DOMAIN || 'jbmeadows26.github.io' }}
          EA_FREE_LLM_LOCAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.research && inputs.free_model) || (github.event_name == 'pull_request' && github.head_ref == 'feature/eastern-axis-keyless-provider-provisioning-20261118') }}
          EA_OPENALEPH_URL: ${{ vars.EA_OPENALEPH_URL }}
          EA_OPENALEPH_TOKEN: ${{ secrets.EA_OPENALEPH_TOKEN }}
          EA_OPENCTI_URL: ${{ vars.EA_OPENCTI_URL }}
          EA_OPENCTI_TOKEN: ${{ secrets.EA_OPENCTI_TOKEN }}
          EA_LDR_URL: ${{ vars.EA_LDR_URL }}
          EA_LDR_USERNAME: ${{ secrets.EA_LDR_USERNAME }}
          EA_LDR_PASSWORD: ${{ secrets.EA_LDR_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.EA_OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.EA_TAVILY_API_KEY }}
          RUN_RESEARCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.research) || (github.event_name == 'pull_request' && github.head_ref == 'feature/eastern-axis-keyless-provider-provisioning-20261118') }}
          QUESTION: ${{ inputs.query || 'Summarize official public cybersecurity guidance from CISA with attributable primary sources' }}
        run: |
          args=(--output eastern-axis/public/analysis/manifest.json --drafts agent-drafts)
          if [ "$RUN_RESEARCH" = true ]; then args+=(--research --query "$QUESTION"); fi
          python eastern-axis/scripts/agent_pipeline.py "${args[@]}"
      - name: Validate local model research includes attributable source references
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/eastern-axis-keyless-provider-provisioning-20261118' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          record=json.loads(Path("eastern-axis/public/analysis/manifest.json").read_text())
          statuses={entry["id"]:entry["status"] for entry in record["connectors"]}
          assert statuses["openosint"]=="ok", statuses
          assert statuses["gpt-researcher"]=="ok", statuses
          assert Path("agent-drafts/GPT-Researcher-UNREVIEWED.md").stat().st_size>100
          print("Verified keyless OpenOSINT and local GPT Researcher draft with references.")
          PY
      - name: Retain public-source-only AI drafts for review
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.research) || (github.event_name == 'pull_request' && github.head_ref == 'feature/eastern-axis-keyless-provider-provisioning-20261118')) }}
        uses: actions/upload-artifact@v4
        with:
          name: eastern-axis-unreviewed-ai-drafts
          path: agent-drafts/
          if-no-files-found: warn
          retention-days: 7
      - name: Commit original-source metadata only
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eastern-axis/public/analysis/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(eastern-axis): refresh attributable analyst source snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
