name: Eastern Axis intelligence analyst
on:
  schedule:
    - cron: '17 06 * * *'
  workflow_dispatch:
    inputs:
      research:
        type: boolean
        default: false
        description: 'Manually run configured AI models into unreviewed public-source artifacts'
      query:
        type: string
        required: false
        description: 'Intelligence research question'
  pull_request:
    paths:
      - 'eastern-axis/src/AgentDesk.tsx'
      - 'eastern-axis/scripts/agent_pipeline.py'
      - 'eastern-axis/tests/test_agent_pipeline.py'
      - '.github/workflows/eastern-axis-ai-analyst.yml'
  push:
    branches: [main]
    paths:
      - 'eastern-axis/scripts/agent_pipeline.py'
      - 'eastern-axis/tests/test_agent_pipeline.py'
      - '.github/workflows/eastern-axis-ai-analyst.yml'
permissions:
  contents: write
concurrency:
  group: ea-source-first-analyst
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed source validation
        run: python -m unittest discover -s eastern-axis/tests -p 'test_agent_pipeline.py' -v
      - name: Install passive OSINT MCP only for an approved scope
        if: ${{ vars.EA_OPENOSINT_DOMAIN != '' }}
        run: python -m pip install "mcp>=1,<3" "uv>=0.7,<2"
      - name: Install AI engines only on explicit manual request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.research }}
        run: python -m pip install "gpt-researcher>=0.15,<1" "local-deep-research>=1,<3"
      - name: Run source digest and optionally create review drafts
        env:
          EA_OPENOSINT_DOMAIN: ${{ vars.EA_OPENOSINT_DOMAIN }}
          EA_OPENALEPH_URL: ${{ vars.EA_OPENALEPH_URL }}
          EA_OPENALEPH_TOKEN: ${{ secrets.EA_OPENALEPH_TOKEN }}
          EA_OPENCTI_URL: ${{ vars.EA_OPENCTI_URL }}
          EA_OPENCTI_TOKEN: ${{ secrets.EA_OPENCTI_TOKEN }}
          EA_LDR_URL: ${{ vars.EA_LDR_URL }}
          EA_LDR_USERNAME: ${{ secrets.EA_LDR_USERNAME }}
          EA_LDR_PASSWORD: ${{ secrets.EA_LDR_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.EA_OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.EA_TAVILY_API_KEY }}
          RUN_RESEARCH: ${{ inputs.research }}
          QUESTION: ${{ inputs.query }}
        run: |
          args=(--output eastern-axis/public/analysis/manifest.json --drafts agent-drafts)
          if [ "$RUN_RESEARCH" = true ]; then args+=(--research --query "$QUESTION"); fi
          python eastern-axis/scripts/agent_pipeline.py "${args[@]}"
      - name: Retain public-source-only AI drafts for review
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.research }}
        uses: actions/upload-artifact@v4
        with:
          name: eastern-axis-unreviewed-ai-drafts
          path: agent-drafts/
          if-no-files-found: warn
          retention-days: 7
      - name: Commit original-source metadata only
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eastern-axis/public/analysis/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(eastern-axis): refresh attributable analyst source snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
