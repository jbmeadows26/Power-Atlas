name: Private local vault cryptographic verification
on:
  pull_request:
    paths:
      - 'site/private-workspace/vault-core.mjs'
      - 'tests/private-vault*'
      - '.github/workflows/private-vault-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/private-vault.test.mjs
