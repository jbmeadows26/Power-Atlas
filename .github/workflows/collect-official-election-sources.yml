name: Index state-certified election source authorities
on:
  push:
    paths:
      - 'scripts/collect_official_election_sources.py'
      - '.github/workflows/collect-official-election-sources.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 6 1 * *'
permissions:
  contents: write
concurrency:
  group: atlas-official-election-authorities
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Index FEC's official state election office directory
        run: python scripts/collect_official_election_sources.py
      - name: Build and validate
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit bounded source index
        run: bash scripts/publish_data.sh data/elections/official-source-index.json data/coverage.json data/app-feed.json data/relationships.json data/research.json
