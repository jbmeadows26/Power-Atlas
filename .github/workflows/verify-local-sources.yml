name: Verify all nine local Census-source connections
on:
  push:
    paths:
      - 'scripts/verify_local_acs_sources.py'
      - 'tests/test_local_issues.py'
      - 'data/place-impact/local-measures-v1.json'
      - '.github/workflows/verify-local-sources.yml'
  schedule:
    - cron: '16 14 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: power-atlas-local-acs-source-audit
  cancel-in-progress: false
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test source schema and fail-closed calculations
        run: python -m unittest discover -s tests -p 'test_local_issues.py' -v
      - name: Verify actual keyless Census Reporter ACS estimates for all nine issues
        run: python -m scripts.verify_local_acs_sources
      - name: Require all nine source observations before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/place-impact/local-source-health-v1.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['schema']=='power-atlas.place-impact.local-source-health.v1'
          assert x['release']=='acs2024_5yr'
          assert len(x['observations'])==9
          for topic,record in x['observations'].items():
              assert record['sourceURL'].startswith('https://api.censusreporter.org/')
              assert len(record['measures'])>=2
              assert any(m['status']=='observed_acs_estimate' for m in record['measures'])
          print('All nine local categories have independently sourced example ZCTA estimates')
          PY
      - name: Commit audited source health only
        run: |
          git config user.name power-atlas-data-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/place-impact/local-source-health-v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: verify nine ACS local issue sources from 2024 five-year ZCTA'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Source health snapshot unchanged'
          fi
