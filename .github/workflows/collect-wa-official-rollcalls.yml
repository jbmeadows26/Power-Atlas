name: Collect official WA 2023–24 legislative rollcalls
on:
  push:
    paths:
      - 'scripts/collect_wa_official_rollcalls.py'
      - 'tests/test_wa_official_rollcalls.py'
      - '.github/workflows/collect-wa-official-rollcalls.yml'
  pull_request:
    paths:
      - 'scripts/collect_wa_official_rollcalls.py'
      - 'tests/test_wa_official_rollcalls.py'
      - '.github/workflows/collect-wa-official-rollcalls.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-wa-rollcalls
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve actual official member-level WA bill votes and verify each summary
        run: python -m scripts.collect_wa_official_rollcalls
      - name: Verify source vote/tally integrity and clear incomplete-biennium status
        run: python -m unittest discover -s tests -p 'test_wa_official_rollcalls.py' -v
      - name: Publish sampled source-linked rollcalls on main without force
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add -- data/legislation/wa-2023-24-rollcalls/source-rollcalls.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: ingest official Washington member legislative vote source sample'
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
