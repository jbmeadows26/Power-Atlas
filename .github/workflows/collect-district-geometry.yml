name: Collect simplified Census 119th district geometry
on:
  push:
    paths:
      - 'scripts/collect_district_geometry.py'
      - '.github/workflows/collect-district-geometry.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 8 1 * *'
permissions:
  contents: write
concurrency:
  group: atlas-district-geometry
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small shapefile reader
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1
      - name: Index compact official district polygons
        run: python scripts/collect_district_geometry.py
      - name: Rebuild and validate data
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish map data
        run: bash scripts/publish_data.sh data/geography/districts-119.geojson data/app-feed.json data/research.json data/relationships.json
