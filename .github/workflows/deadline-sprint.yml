name: Deadline ingestion sprint to Oct 30
on:
  push:
    paths:
      - 'scripts/run_deadline_sprint.py'
      - '.github/workflows/deadline-sprint.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 28-30 10 *'
permissions:
  contents: write
concurrency:
  group: atlas-deadline-sprint
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect independent public sources and record blockers
        run: python scripts/run_deadline_sprint.py
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      - name: Regenerate and test the compact dataset
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit data and ingestion health safely
        run: bash scripts/publish_data.sh data
