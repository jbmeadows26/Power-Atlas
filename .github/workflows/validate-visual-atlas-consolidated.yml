name: Validate consolidated Power Atlas visual atlas
on:
  push:
    branches: [release/visual-atlas-v4-consolidated-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild deterministic feeds
        run: python scripts/build.py
      - name: Validate all Power Atlas evidence and visual UI tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensure no review-only artifacts in final release
        run: |
          test ! -f platform/unified/redesign-preview.html
          test ! -f site/redesign-preview.html
          ! grep -R 'power-atlas-visual-review.vercel.app\|__PA4_UNIFIED_PREVIEW__\|noindex,nofollow' platform/unified/atlas-visual-system.js site/atlas-visual-system.js
