name: Eastern Axis physical early warning
on:
  schedule:
    - cron: '41 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'eastern-axis/scripts/collect_early_warning.py'
      - 'eastern-axis/scripts/early_warning_sources.py'
      - 'eastern-axis/src/CountryPicker.tsx'
      - 'eastern-axis/tests/test_early_warning_sources.py'
      - 'eastern-axis/tests/test_early_warning.py'
      - 'eastern-axis/src/PhysicalEarlyWarning.tsx'
      - 'eastern-axis/src/earlyWarningDates.ts'
      - 'eastern-axis/tests/earlyWarningDates.test.mjs'
      - 'eastern-axis/src/earlyWarningCatalog.ts'
      - '.github/workflows/eastern-axis-early-warning.yml'
  pull_request:
    paths:
      - 'eastern-axis/scripts/collect_early_warning.py'
      - 'eastern-axis/scripts/early_warning_sources.py'
      - 'eastern-axis/src/CountryPicker.tsx'
      - 'eastern-axis/tests/test_early_warning_sources.py'
      - 'eastern-axis/tests/test_early_warning.py'
      - 'eastern-axis/src/PhysicalEarlyWarning.tsx'
      - 'eastern-axis/src/earlyWarningCatalog.ts'
      - 'eastern-axis/src/App.tsx'
      - 'eastern-axis/src/physicalEarlyWarning.css'
      - '.github/workflows/eastern-axis-early-warning.yml'
permissions:
  contents: write
concurrency:
  group: eastern-axis-physical-warning
  cancel-in-progress: false
jobs:
  validate:
    name: Source parser and dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XLSX source parser
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Validate source dates, attribution and statistical baselines
        run: |
          python -m unittest discover -s eastern-axis/tests -p test_early_warning.py -v
          python -m unittest discover -s eastern-axis/tests -p test_early_warning_sources.py -v
      - name: Live source smoke check on proposed changes (never published)
        if: github.event_name == 'pull_request'
        run: |
          python eastern-axis/scripts/collect_early_warning.py --strict --output "$RUNNER_TEMP/early-warning-probe.json"
          python - "$RUNNER_TEMP/early-warning-probe.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          for source in data['sources']:
              print(source['id'],source['status'],source['detail'])
          print('Source status:',data['status'],'measurements:',len(data['metrics']))
          if not any(s['id']=='fao-food' and s['status']=='ok' for s in data['sources']): print('FAO source needs attention.')
          if not any(s['id'].startswith('gps:') and s['status']=='ok' for s in data['sources']): print('GNSS source needs attention.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate monthly and daily published observation dates
        run: node --experimental-strip-types --test eastern-axis/tests/earlyWarningDates.test.mjs
      - name: Build the unified dashboard
        working-directory: eastern-axis
        run: |
          npm install --no-audit --no-fund
          npm run build
  collect:
    needs: validate
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded official-source parser
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Collect authenticated-by-source public observations
        run: python eastern-axis/scripts/collect_early_warning.py --strict
      - name: Commit the source-dated snapshot on main only
        run: |
          git add eastern-axis/public/analysis/physical-early-warning.json
          if git diff --cached --quiet; then
            echo "No changes to the verified public snapshot."
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data(eastern-axis): refresh attributable physical warning source snapshot [skip ci]"
            # Another unrelated merged PR or source collector may advance main.
            # Retry a normal fast-forward after rebasing; never force-push or
            # overwrite a newer verified snapshot if the file conflicts.
            published=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "Main moved before publishing; reconciling attempt $attempt/3"
              git fetch origin main
              if ! git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" rebase origin/main; then
                git rebase --abort || true
                echo "Snapshot conflict: keeping the newer remote record; manual source review required." >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
            if [ "$published" != true ]; then
              echo "Could not safely publish source snapshot after three fast-forward retries." >&2
              exit 1
            fi
          fi
