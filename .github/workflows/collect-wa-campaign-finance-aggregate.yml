name: Ingest privacy-minimized WA campaign-finance aggregate summaries
on:
  push:
    paths:
      - 'scripts/collect_wa_campaign_finance_aggregate.py'
      - 'tests/test_wa_campaign_finance_aggregate.py'
      - '.github/workflows/collect-wa-campaign-finance-aggregate.yml'
  pull_request:
    paths:
      - 'scripts/collect_wa_campaign_finance_aggregate.py'
      - 'tests/test_wa_campaign_finance_aggregate.py'
      - '.github/workflows/collect-wa-campaign-finance-aggregate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-wa-pdc-anonymized-aggregates
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic aggregated-source parser and privacy thresholds
        run: python -m unittest discover -s tests -p 'test_wa_campaign_finance_aggregate.py' -v
      - name: Fetch official WA PDC financial summaries grouped before download
        run: python -m scripts.collect_wa_campaign_finance_aggregate
      - name: Prevent personal donor records and unreviewed commercial licensing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/finance/wa-pdc/summary-aggregate-2020-2024.json').read_text())
          assert d['categoryRows']>=3
          assert d['state']=='WA'
          assert d['campaignFinanceCompleteForWA'] is False
          assert d['all50StatesComplete'] is False
          assert 'noncommercial' in d['licensingGate']
          assert all(r['publishedSummaryRows']>=5 for r in d['records'])
          assert all(not (set(r) & {'filer_name','treasurer_name','committee_address','committee_email','contributor_name'}) for r in d['records'])
          print('Published only nonidentifying group-level finance summary rows; no donor lists.')
          PY
      - name: Publish only grouped election-year/filer-type totals with license gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add -- data/finance/wa-pdc/summary-aggregate-2020-2024.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: source official WA PDC nonpersonal campaign finance categories'
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((2*attempt))"
          done
          exit 1
