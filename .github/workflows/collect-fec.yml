name: Collect FEC committee candidates
on:
  push:
    paths:
      - 'scripts/collect_fec.py'
      - 'scripts/build.py'
      - '.github/workflows/collect-fec.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 10 * * 2'
permissions:
  contents: write
concurrency:
  group: atlas-main-writes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect bounded public committee metadata
        run: python scripts/collect_fec.py
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      - name: Merge compact feed
        run: python scripts/build.py
      - name: Publish with bounded rebase retries
        run: bash scripts/publish_data.sh data/batches/fec-committees.json data/research.json data/relationships.json data/app-feed.json
