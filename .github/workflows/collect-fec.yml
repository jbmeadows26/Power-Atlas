name: Collect FEC committee candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '25 10 * * 2'
permissions:
  contents: write
concurrency:
  group: atlas-fec-ingest
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect bounded public committee metadata
        run: python scripts/collect_fec.py
      - name: Merge compact feed
        run: python scripts/build.py
      - name: Commit changed records only
        run: |
          if ! git diff --quiet -- data/batches/fec-committees.json data/research.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/batches/fec-committees.json data/research.json
            git commit -m "data: bounded FEC committee discovery"
            git push
          fi
