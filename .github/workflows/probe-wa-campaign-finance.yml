name: Probe official Washington state campaign finance source
on:
  push:
    paths:
      - 'scripts/probe_wa_campaign_finance.py'
      - '.github/workflows/probe-wa-campaign-finance.yml'
  pull_request:
    paths:
      - 'scripts/probe_wa_campaign_finance.py'
      - '.github/workflows/probe-wa-campaign-finance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect no-key official WA PDC summary schema without republishing private contributors
        run: python -m scripts.probe_wa_campaign_finance
