name: Collect CoreCivic federal contract actions
on:
  push:
    paths:
      - 'scripts/collect_corecivic_awards.py'
      - 'tests/test_corecivic_awards.py'
      - '.github/workflows/collect-corecivic-awards.yml'
  schedule:
    - cron: '09 13 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: power-atlas-corecivic-awards
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test legal identity and collector validation
        run: |
          python -m unittest discover -s tests -p test_corecivic_awards.py -v
          python -m unittest discover -s tests -p test_business_federal_awards.py -v
      - name: Collect Treasury prime contract actions by exact verified UEI
        run: python -m scripts.collect_corecivic_awards
      - name: Verify all fiscal years and reporting scope before commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/business-influence/corecivic-federal-contracts-v1.json').read_text())
          assert d['schema']=='power-atlas.corecivic-federal-contracts.v1'
          assert d['entity']['uei']=='HJGMJN1JKL46'
          assert len(d['entity']['years'])>=9
          for y in d['entity']['years']:
              assert y['sourcePagesRead']>=1
              assert abs(y['netObligationsUsd']-(y['grossPositiveObligationsUsd']+y['deobligationsUsd']))<.02
              assert y['recordCoverage']=='complete_uei_search_page_walk_not_a_contract_universe_audit'
          assert any('No FEC political donation' in x for x in d['limitations'])
          PY
      - name: Commit new official data only when successful
        run: |
          git config user.name 'power-atlas-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/business-influence/corecivic-federal-contracts-v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh CoreCivic exact-UEI Treasury contract actions'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No source changes'
          fi
