name: Eastern Axis product shortage intelligence
on:
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Eastern Axis physical early warning']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'eastern-axis/scripts/forecast_product_shortages.py'
      - 'eastern-axis/scripts/collect_shortage_inventory.py'
      - 'eastern-axis/scripts/review_shortage_outlook.py'
      - 'eastern-axis/tests/test_shortage_inventory.py'
      - 'eastern-axis/tests/test_shortage_forecasts.py'
      - '.github/workflows/eastern-axis-shortage-analyst.yml'
  pull_request:
    paths:
      - 'eastern-axis/scripts/collect_shortage_inventory.py'
      - 'eastern-axis/scripts/review_shortage_outlook.py'
      - 'eastern-axis/tests/test_shortage_inventory.py'
      - 'eastern-axis/scripts/forecast_product_shortages.py'
      - 'eastern-axis/tests/test_shortage_forecasts.py'
      - 'eastern-axis/src/ShortageForecasts.tsx'
      - 'eastern-axis/src/shortageForecasts.css'
      - 'eastern-axis/src/EconomicIntelligence.tsx'
      - 'eastern-axis/src/economicIntelligence.css'
      - '.github/workflows/eastern-axis-shortage-analyst.yml'
permissions:
  contents: write
concurrency:
  group: eastern-axis-shortage-analyst
  cancel-in-progress: false
jobs:
  forecast:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shortage evidence gates
        run: python -m unittest discover -s eastern-axis/tests -p 'test_shortage_forecasts.py' -v
      - name: Validate newly connected inventory parsers and local analyst gates
        run: python -m unittest discover -s eastern-axis/tests -p 'test_shortage_inventory.py' -v
      - name: Pull bounded direct EIA stocks and U.S. Census inventories
        run: python eastern-axis/scripts/collect_shortage_inventory.py
      - name: Build source-dated, fail-closed shortage scenarios
        run: |
          test -s eastern-axis/public/analysis/physical-early-warning.json
          python eastern-axis/scripts/forecast_product_shortages.py

          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('eastern-axis/public/analysis/product-shortage-outlook.json')
          report=json.loads(path.read_text())
          assert report['schemaVersion']==1
          assert len(report['forecasts'])==report['summary']['products']
          assert report['summary']['commandEligible']==0
          assert all(not row['confirmedShortage'] and not row['commandEligible'] and
                     row['confidence']=='limited' and row['scoreType']=='uncalibrated-triage-not-probability'
                     for row in report['forecasts'])
          print('Evidence-validated forecast snapshot:',report['summary'])
          PY
      - name: Check whether any price, stock or route screens qualify for model triage
        id: triage
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys,json
          sys.path.insert(0,"eastern-axis/scripts")
          from review_shortage_outlook import candidates
          from pathlib import Path
          d=json.loads(Path("eastern-axis/public/analysis/product-shortage-outlook.json").read_text())
          print("count="+str(len(candidates(d))))
          PY
      - name: Start isolated free CPU analyst for source-linked candidates only
        if: ${{ github.event_name != 'pull_request' && steps.triage.outputs.count != '0' }}
        continue-on-error: true
        run: |
          docker run --detach --name eastern-axis-shortage-ollama \
            -e OLLAMA_HOST=0.0.0.0:11434 -e OLLAMA_NUM_PARALLEL=1 \
            --publish 127.0.0.1:11434:11434 ollama/ollama:latest
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          docker exec eastern-axis-shortage-ollama ollama pull qwen2.5:1.5b
      - name: AI review candidates without automatic shortage or Command escalation
        run: |
          args=()
          if [ "${{ github.event_name }}" != "pull_request" ] && \
             curl -fsS --max-time 3 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            args+=(--model-endpoint http://127.0.0.1:11434)
          fi
          python eastern-axis/scripts/review_shortage_outlook.py "${args[@]}"
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('eastern-axis/public/analysis/product-shortage-outlook.json').read_text())
          assert d['summary']['commandEligible']==0
          assert d['analyst']['screened']==d['summary']['products']
          assert all(not x['confirmedShortage'] and not x['commandEligible'] for x in d['forecasts'])
          assert all(x.get('modelReviewed') == bool(x.get('modelAssessment')) for x in d['forecasts'])
          print('AI triage (fail-closed):',d['analyst']['status'],d['analyst']['reviewed'])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Economic Intelligence frontend compiles
        working-directory: eastern-axis
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit verified scenario snapshot
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          git add eastern-axis/public/analysis/product-shortage-outlook.json eastern-axis/public/analysis/product-inventory-context.json
          if git diff --cached --quiet; then
            echo "No changes to published product forecast snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(eastern-axis): publish guarded product shortage outlook [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Forecast artifact conflict: refusing to overwrite a newer snapshot" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          exit 1
