name: Collect official FEC committee-recipient aggregates
on:
  push:
    paths:
      - 'scripts/collect_fec_recipient_aggregates.py'
      - '.github/workflows/collect-fec-recipient-aggregates.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * 5'
permissions:
  contents: write
concurrency:
  group: atlas-fec-recipient-aggregates
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch bounded official recipient-committee aggregates
        run: python scripts/collect_fec_recipient_aggregates.py
      - name: Rebuild and validate
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish only validated aggregate records
        run: bash scripts/publish_data.sh data/finance/fec-recipient-aggregates.json data/app-feed.json data/coverage.json
