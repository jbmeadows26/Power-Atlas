name: Publish Power Atlas + Eastern Axis to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'adaptive-intelligence/**'
      - 'tests/adaptive-intelligence*'
      - 'tests/private-vault*'
      - 'business-intelligence/**'
      - 'tests/business-intelligence*'
      - 'tests/test_business_hts_reference.py'
      - 'tests/test_business_ofac_reference.py'
      - 'personal-intelligence/**'
      - 'tests/personal-intelligence*'
      - 'eastern-axis/src/**'
      - 'eastern-axis/tests/**'
      - 'eastern-axis/index.html'
      - 'eastern-axis/vite.config.ts'
      - 'eastern-axis/package.json'
      - 'eastern-axis/package-lock.json'
      - 'eastern-axis/public/favicon.svg'
      - 'eastern-axis/public/analysis/**'
      - 'eastern-axis/public-api-origin.txt'
      - 'eastern-axis/scripts/pages_browser_qa.cjs'
      - 'eastern-axis/scripts/neon_api_audit.py'
      - 'eastern-axis/scripts/collect_military_inventory.py'
      - 'eastern-axis/scripts/collect_military_equipment.py'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/pages_release_identity.py'
      - 'tests/test_pages_release_identity.py'
  workflow_dispatch:
  workflow_run:
    workflows: ['Eastern Axis intelligence analyst', 'Eastern Axis physical early warning', 'Eastern Axis signal analyst', 'Eastern Axis market contagion watch', 'Eastern Axis product shortage intelligence', 'Eastern Axis global conflict analyst', 'Eastern Axis military asset change analyst']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: power-atlas-gh-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare and validate Personal Intelligence local import reader
        run: |
          node --test tests/personal-intelligence-import.test.mjs
          bash personal-intelligence/backend/prepare-local-reader.sh
      - name: Preserve the existing Power Atlas site
        run: |
          test -s site/index.html
          test ! -f site/.env
      - name: Validate the independent public Neon API before publishing
        env:
          EA_PUBLIC_FALLBACK_DIR: eastern-axis/public/api-fallback
        run: |
          test -s eastern-axis/public-api-origin.txt
          python3 eastern-axis/scripts/neon_api_audit.py
      - name: Fail closed on unsupported published analyst promotions
        run: python3 -m unittest discover -s eastern-axis/tests -p 'test_signal_analyst.py' -v
      - name: Check reviewed military sources and year classifications
        run: python3 -m unittest discover -s eastern-axis/tests -p 'test_military_inventory.py' -v
      - name: Enrich static military inventory with dated World Bank observations
        run: |
          python3 eastern-axis/scripts/collect_military_inventory.py
          python3 -m unittest discover -s eastern-axis/tests -p 'test_military_inventory.py' -v
      - name: Audit published intelligence snapshots and source provenance
        run: python3 eastern-axis/scripts/audit_published_data.py
      - name: Validate worldwide military equipment schema and zero handling
        run: python3 -m unittest discover -s eastern-axis/tests -p 'test_military_equipment.py' -v
      - name: Import CC BY 4.0 military equipment with pinned SHA-256 and completeness gates
        run: |
          python3 eastern-axis/scripts/collect_military_equipment.py
          python3 -m unittest discover -s eastern-axis/tests -p 'test_military_equipment.py' -v
      - name: Check analyst interpretation coverage and source gating
        run: node --experimental-strip-types --test eastern-axis/tests/domainAnalysts.test.mjs
      - name: Validate international source provenance and ISO3 country mapping
        run: node --experimental-strip-types --test eastern-axis/tests/multilateralSources.test.mjs
      - name: Install and build Eastern Axis for its Pages subpath
        working-directory: eastern-axis
        env:
          VITE_EA_TARGET: github-pages
        run: |
          export VITE_EA_API_ORIGIN="$(tr -d '\r\n' < public-api-origin.txt)"
          case "$VITE_EA_API_ORIGIN" in
            https://*.neon.tech) ;;
            *) echo 'Refusing to publish without a verified independent HTTPS API.' >&2; exit 1 ;;
          esac
          npm install --no-audit --no-fund
          npx vite build --base ./
          test -s dist/index.html
          grep -q './assets/' dist/index.html
          grep -q 'data-ea-dashboard-css="inline"' dist/index.html
          grep -q "content=\"$GITHUB_SHA\"" dist/index.html
          if grep -R -E 'postgres(ql)?://' dist; then
            echo 'Unexpected database credential-like URI in frontend output' >&2
            exit 1
          fi
      - name: Install browser regression tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/ea-pages-check" --no-save playwright@1.56.1
          "$RUNNER_TEMP/ea-pages-check/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify mobile touch navigation at 320px and 390px, plus desktop
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ea-pages-check/node_modules/playwright
        run: node eastern-axis/tests/mobile_navigation_smoke.cjs
      - name: Start the compiled Pages candidate
        working-directory: eastern-axis
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort > /tmp/ea-pages-deploy-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/ea-pages-deploy-preview.log; exit 1
      - name: Verify iPhone WebKit layout even when external stylesheets are blocked
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ea-pages-check/node_modules/playwright
          EA_BROWSER_ORIGIN: http://127.0.0.1:4174
        run: node eastern-axis/tests/stylesheet_integrity.cjs
      - name: Verify real intelligence content and country context on desktop/mobile
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ea-pages-check/node_modules/playwright
          EA_BROWSER_ORIGIN: http://127.0.0.1:4174
        run: |
          mkdir -p audit-output
          node eastern-axis/scripts/pages_browser_qa.cjs
      - name: Keep test screenshots and API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eastern-axis-pages-release-qa
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish the verified Eastern Axis app without replacing Power Atlas
        run: |
          mkdir -p site/eastern-axis
          cp -R eastern-axis/dist/. site/eastern-axis/
          test -s site/index.html
          test -s site/eastern-axis/index.html
          test -d site/eastern-axis/assets
          test ! -f site/eastern-axis/.env
          echo 'Power Atlas remains the root; Eastern Axis is at /Power-Atlas/eastern-axis/.'
      - name: Verify Personal Intelligence import in both browser engines
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ea-pages-check/node_modules/playwright
        run: |
          python3 -m http.server 4175 --directory site > /tmp/pi-import-preview.log 2>&1 &
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:4175/personal-intelligence/ >/dev/null && break; sleep 1; done
          node tests/personal-intelligence-import-browser.cjs
      - name: Prepare local document parsers
        run: bash business-intelligence/prepare-document-assets.sh
      - name: Build business procurement reference
        run: |
          node --test tests/business-intelligence-procurement.test.mjs
          python3 -m unittest discover -s tests -p test_business_hts_reference.py -v
          python3 business-intelligence/collect_hts_reference.py
          node --test tests/business-intelligence-suppliers.test.mjs
          python3 -m unittest discover -s tests -p test_business_ofac_reference.py -v
          python3 business-intelligence/collect_ofac_reference.py
      - name: Prepare and test Adaptive Intelligence local assets
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ea-pages-check/node_modules/playwright
        run: |
          node --test tests/adaptive-intelligence.test.mjs
          bash adaptive-intelligence/prepare-assets.sh
          node tests/adaptive-intelligence-browser.cjs
      - name: Verify encrypted local profile storage before publishing
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ea-pages-check/node_modules/playwright
        run: |
          node --test tests/private-vault.test.mjs
          node tests/private-vault-browser.cjs
          node tests/private-vault-personal-browser.cjs
      - name: Verify business document and relational workflows before publishing
        env:
          BUSINESS_TEST_URL: http://127.0.0.1:4175/business-intelligence/
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ea-pages-check/node_modules/playwright
        run: |
          node --test tests/business-*.test.mjs
          node tests/business-documents-browser.cjs
          node tests/business-document-review-browser.cjs
          node tests/business-document-formats-browser.cjs
          node tests/business-twin-browser.cjs
          node tests/business-twin-editing-browser.cjs
      - name: Record content-addressed public release identity
        run: |
          python3 -m unittest discover -s tests -p test_pages_release_identity.py -v
          python3 scripts/pages_release_identity.py build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload one Pages artifact containing both sites
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Power Atlas and Eastern Axis to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact published HTML and embedded stylesheet
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL "https://jbmeadows26.github.io/Power-Atlas/eastern-axis/?release=$GITHUB_SHA" -o /tmp/ea-published.html &&
               grep -q 'data-ea-dashboard-css="inline"' /tmp/ea-published.html &&
               grep -q "content=\"$GITHUB_SHA\"" /tmp/ea-published.html; then exit 0; fi
            sleep 8
          done
          echo "Expected release or embedded stylesheet not served by Pages" >&2
          exit 1
      - name: Verify exact business release and public asset integrity
        run: python3 scripts/pages_release_identity.py verify --commit "$GITHUB_SHA"
      - name: Verify published Business Intelligence and procurement reference status
        run: |
          curl -fsSL "https://jbmeadows26.github.io/Power-Atlas/business-intelligence/?release=$GITHUB_SHA" | grep 'id="procurement"'
          curl -fsSL "https://jbmeadows26.github.io/Power-Atlas/business-intelligence/data/hts-manifest.json?release=$GITHUB_SHA" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schemaVersion"]==1 and d["status"] in ("available","unavailable"); print("HTS reference status:",d["status"],d["release"])'
      - name: Verify published supplier reference status
        run: |
          curl -fsSL "https://jbmeadows26.github.io/Power-Atlas/business-intelligence/?release=$GITHUB_SHA" | grep 'id="suppliers"'
          curl -fsSL "https://jbmeadows26.github.io/Power-Atlas/business-intelligence/data/ofac-organizations.json?release=$GITHUB_SHA" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schemaVersion"]==1 and set(d["sources"])=={"SDN","Consolidated"}; print({k:v["status"] for k,v in d["sources"].items()})'
      - name: Verify published Adaptive Intelligence model manifest
        run: |
          curl -fsSL "https://jbmeadows26.github.io/Power-Atlas/private-workspace/adaptive-assets/manifest.json?release=$GITHUB_SHA" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schemaVersion"]==1 and d["model"]=="Xenova/all-MiniLM-L6-v2" and d["bytes"]>20000000; print(d["runtime"],d["bytes"])'
      - name: Verify published local vault modules
        run: |
          for file in private-workspace/vault-core.mjs private-workspace/vault-ui.mjs business-intelligence/app.mjs personal-intelligence/app.mjs; do
            curl -fsSL "https://jbmeadows26.github.io/Power-Atlas/$file?release=$GITHUB_SHA" -o /tmp/published-vault-module.mjs
            cmp "/tmp/published-vault-module.mjs" "site/$file"
          done
      - name: Install WebKit production QA
        run: |
          npm install --prefix "$RUNNER_TEMP/ea-pages-check" --no-save playwright@1.56.1
          "$RUNNER_TEMP/ea-pages-check/node_modules/.bin/playwright" install --with-deps webkit chromium
      - name: Verify real published iPhone and desktop styling
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ea-pages-check/node_modules/playwright
          EA_BROWSER_ORIGIN: https://jbmeadows26.github.io/Power-Atlas/eastern-axis
        run: node eastern-axis/tests/stylesheet_integrity.cjs
      - name: Save production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eastern-axis-production-style-qa
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14
