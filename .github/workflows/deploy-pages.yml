name: Publish Power Atlas and Eastern Axis to GitHub Pages
on:
  # Pages > Source: GitHub Actions must be enabled by repo admin.
  # Manual-only until the Eastern Axis Neon API passes a live QA audit.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: power-atlas-gh-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify existing Power Atlas Pages site
        run: |
          test -f site/index.html
          test ! -f site/.env
      - name: Read verified public Neon API origin
        run: |
          test -s eastern-axis/public-api-origin.txt
          echo "VITE_EA_API_ORIGIN=$(cat eastern-axis/public-api-origin.txt)" >> "$GITHUB_ENV"
      - name: Build Eastern Axis at a safe subpath
        working-directory: eastern-axis
        env:
          VITE_EA_TARGET: github-pages
        run: |
          if [ -z "$VITE_EA_API_ORIGIN" ]; then
            echo 'EA_API_ORIGIN is missing: refusing to publish a broken Eastern Axis frontend.' >&2
            exit 1
          fi
          case "$VITE_EA_API_ORIGIN" in
            https://*.neon.tech|https://*.neon.tech/) ;;
            *) echo 'Expected the verified Neon Function HTTPS origin.' >&2; exit 1 ;;
          esac
          npm install --no-audit --no-fund
          npx vite build --base ./
          mkdir -p ../site/eastern-axis
          cp -R dist/. ../site/eastern-axis/
      - name: Validate both websites are in the release
        run: |
          test -s site/index.html
          test -s site/eastern-axis/index.html
          test -d site/eastern-axis/assets
          test ! -f site/eastern-axis/.env
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Power Atlas and Eastern Axis
        id: deployment
        uses: actions/deploy-pages@v4
