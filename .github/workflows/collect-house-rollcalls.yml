name: Collect official House roll-call indexes
on:
  push:
    paths:
      - 'scripts/collect_house_rollcalls.py'
      - '.github/workflows/collect-house-rollcalls.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 11 * * 2'
permissions:
  contents: write
concurrency:
  group: atlas-house-roll-index
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Index official bounded House Clerk roll-call tables
        run: python scripts/collect_house_rollcalls.py
      - name: Build and validate compact data feed
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish source-indexed voting records
        run: bash scripts/publish_data.sh data/legislation/house-119-rollcalls.json data/coverage.json data/app-feed.json data/relationships.json data/research.json
