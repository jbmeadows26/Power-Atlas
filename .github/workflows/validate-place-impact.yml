name: Validate place-first life-impact stories
on:
  push:
    paths:
      - 'data/place-impact/**'
      - 'data/corporate-ownership/**'
      - 'data/research/atlas-inventory-v1.json'
      - 'platform/unified/*.html'
      - 'platform/unified/global-navigation.css'
      - 'tests/test_place_impact.py'
      - 'tests/test_local_issues.py'
      - 'tests/test_connected_daily_life.py'
      - 'tests/test_corporate_ownership.py'
      - 'scripts/verify_local_acs_sources.py'
      - 'tests/test_global_navigation.py'
      - '.github/workflows/validate-place-impact.yml'
  pull_request:
    paths:
      - 'data/place-impact/**'
      - 'data/corporate-ownership/**'
      - 'data/research/atlas-inventory-v1.json'
      - 'platform/unified/*.html'
      - 'platform/unified/global-navigation.css'
      - 'tests/test_place_impact.py'
      - 'tests/test_local_issues.py'
      - 'tests/test_connected_daily_life.py'
      - 'tests/test_corporate_ownership.py'
      - 'scripts/verify_local_acs_sources.py'
      - 'tests/test_global_navigation.py'
      - '.github/workflows/validate-place-impact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate issue pathways and all 25 plus nine deep tracks
        run: |
          python -m unittest discover -s tests -p 'test_place_impact.py' -v
          python -m unittest discover -s tests -p 'test_local_issues.py' -v
          python -m unittest discover -s tests -p 'test_connected_daily_life.py' -v
          python -m unittest discover -s tests -p 'test_corporate_ownership.py' -v
      - name: Validate consistent community-first navigation on all pages
        run: python -m unittest discover -s tests -p 'test_global_navigation.py' -v
      - name: Validate browser source-map and research interactions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ('my-life.html','corporate-ownership.html'):
              html=Path('platform/unified',name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script\s*>(.*?)</script>',html,re.S)
              assert len(scripts)==1, "A single browser entrypoint is required for "+name
              Path('/tmp/'+name+'.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/my-life.html.js
          node --check /tmp/corporate-ownership.html.js
