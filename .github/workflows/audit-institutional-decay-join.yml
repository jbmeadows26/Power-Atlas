name: Audit country-year OECD integrity to trust join eligibility
on:
  push:
    paths:
      - '.github/workflows/audit-institutional-decay-join.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: institutional-decay-join-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce source-level year, country and measure coverage
        run: python scripts/audit_institutional_decay_join.py
      - name: Run coverage and predictor-outcome leakage tests
        run: python -m unittest discover -s tests -p 'test_institutional_decay_join_readiness.py' -v
      - name: Commit qualified audit only to research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/institutional-decay/indicator-join-readiness-2026-10-30.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: audit measured OECD integrity-to-trust join eligibility'
            git push origin HEAD:research/institutional-decay-join-audit-20261030
          else
            echo 'Audit unchanged'
          fi
