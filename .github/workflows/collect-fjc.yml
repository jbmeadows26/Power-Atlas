name: Collect FJC Article III judge appointments
on:
  push:
    paths:
      - 'scripts/collect_fjc_judges.py'
      - '.github/workflows/collect-fjc.yml'
  workflow_dispatch:
  schedule:
    - cron: '50 8 1 * *'
permissions:
  contents: write
concurrency:
  group: atlas-judiciary
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect compact official appointment records
        run: python scripts/collect_fjc_judges.py
      - name: Update and validate normalized feed
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish with conflict-safe retries
        run: bash scripts/publish_data.sh data/judiciary/fjc-appointments.json data/judiciary/fjc-appointment-index.json data/app-feed.json data/research.json data/relationships.json
