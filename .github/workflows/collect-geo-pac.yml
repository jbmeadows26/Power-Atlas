name: Refresh GEO PAC federal candidate contributions (FEC bulk, free)
on:
  push:
    paths:
      - 'scripts/collect_geo_pac_fec.py'
      - 'tests/test_geo_pac_fec.py'
      - '.github/workflows/collect-geo-pac.yml'
  schedule:
    - cron: '47 12 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: power-atlas-geo-pac
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test committee-level FEC evidence and privacy
        run: |
          python -m unittest discover -s tests -p 'test_geo_pac_fec.py' -v
          python -m unittest discover -s tests -p 'test_business_influence.py' -v
      - name: Download original committee-to-candidate FEC bulk (5 cycles)
        run: python -m scripts.collect_geo_pac_fec
      - name: Validate source checksums and committee-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/business-influence/geo-pac-candidate-disbursements-v1.json').read_text())
          assert d['schema']=='power-atlas.geo-pac-itemized-to-candidates.v1'
          assert len(d['cycles'])==5
          for y in d['cycles']:
            assert len(y['archiveSha256'])==64 and y['rowsScanned']>=y['matchedCommitteeRows']
            assert all(x['sourceCommitteeId']=='C00382150' for x in y['records'])
            assert all(x['recipientCommitteeId'].startswith('C') for x in y['records'])
          forbidden=['PRIVATE CITY','PRIVATE ADDRESS','EMPLOYER PRIVACY','OCCUPATION PRIVACY']
          t=json.dumps(d)
          assert not any(x in t for x in forbidden)
          print('Official FEC archive snapshots checked; no person-level details retained')
          PY
      - name: Commit only validated public FEC committee-level records
        run: |
          git config user.name 'power-atlas-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/business-influence/geo-pac-candidate-disbursements-v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: GEO PAC filed candidate committee transfers (FEC, bounded)'
            git push origin HEAD:main
          else
            echo 'FEC source snapshot unchanged'
          fi
