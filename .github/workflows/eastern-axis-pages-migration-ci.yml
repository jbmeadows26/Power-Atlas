name: Eastern Axis | GitHub Pages migration QA
on:
  push:
    branches:
      - 'migration/eastern-axis-pages-free'
    paths:
      - '.github/workflows/eastern-axis-pages-migration-ci.yml'
      - 'eastern-axis/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-pages-and-neon-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies (no paid services)
        working-directory: eastern-axis
        run: npm install --no-audit --no-fund
      - name: Build GitHub Pages frontend (no Vercel fallback)
        working-directory: eastern-axis
        env:
          VITE_EA_TARGET: github-pages
          VITE_EA_API_ORIGIN: ${{ vars.EA_API_ORIGIN }}
        run: npx vite build --base ./
      - name: Bundle standalone Neon Function
        working-directory: eastern-axis
        run: |
          node scripts/build-neon.mjs
          test -s neon-release/index.mjs
          (cd neon-release && zip -q ../neon-function.zip index.mjs)
      - name: Verify Pages assets and API isolation
        run: |
          test -f eastern-axis/dist/index.html
          test -f site/index.html
          grep -q 'assets/' eastern-axis/dist/index.html
          ! grep -q 'eastern-axis-resources-power.vercel.app' eastern-axis/dist/index.html
          ! grep -q 'EA_DATABASE_URL' eastern-axis/dist/index.html
      - name: Upload static site preview
        uses: actions/upload-artifact@v4
        with:
          name: eastern-axis-pages-preview
          path: eastern-axis/dist/
          retention-days: 7
      - name: Upload Neon backend deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: eastern-axis-neon-bundle
          path: eastern-axis/neon-function.zip
          retention-days: 7
      - name: Stage short-lived Neon transfer chunks for connected deployment
        # Temporary text chunks carry only compiled open-source code, never secrets.
        # They are not part of the Pages artifact or the eventual production PR.
        run: |
          mkdir -p .neon-transfer
          base64 -w0 eastern-axis/neon-function.zip | fold -w 16000 | split -d -a 3 - .neon-transfer/part-
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .neon-transfer
          if ! git diff --cached --quiet; then
            git commit -m 'chore(temporary): stage compiled Neon bundle for connector handoff'
            git push origin HEAD:migration/eastern-axis-pages-free
          fi
      - name: State migration gate
        run: |
          echo '### Migration build passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'This validates compiled artifacts, not a live Neon API or GitHub Pages publication.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not switch off Vercel until all API routes and desktop/mobile QA pass.' >> "$GITHUB_STEP_SUMMARY"
