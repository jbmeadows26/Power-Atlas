name: Collect public federal redistricting and election bill index
on:
  push:
    paths:
      - 'scripts/collect_federal_bills.py'
      - '.github/workflows/collect-federal-bills.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 4'
permissions:
  contents: write
concurrency:
  group: atlas-federal-bill-index
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query bounded public source-linked bill index
        run: python scripts/collect_federal_bills.py
      - name: Rebuild and test portable evidence graph
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish verified-format bill candidates
        run: bash scripts/publish_data.sh data/legislation/federal-bill-candidates.json data/relationships.json data/app-feed.json data/coverage.json data/research.json
