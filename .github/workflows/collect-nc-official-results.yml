name: Reconcile official North Carolina 2024 precinct votes and judicial races
on:
  push:
    paths:
      - 'scripts/probe_nc_official_returns.py'
      - 'scripts/ingest_nc_2024_results.py'
      - 'tests/test_nc_results_2024.py'
      - '.github/workflows/collect-nc-official-results.yml'
  pull_request:
    paths:
      - 'scripts/probe_nc_official_returns.py'
      - 'scripts/ingest_nc_2024_results.py'
      - 'tests/test_nc_results_2024.py'
      - '.github/workflows/collect-nc-official-results.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-nc-2024-certified-reconciliation
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ingest official NC 2024 precinct and county-level results
        run: python -m scripts.ingest_nc_2024_results
      - name: Verify original source SHA, 100 counties, judicial outcomes and certified totals
        run: python -m unittest discover -s tests -p 'test_nc_results_2024.py' -v
      - name: Verify no misleading claim of all-contest reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/elections/nc-2024/reconciliation.json')
          data=json.loads(p.read_text())
          assert data['countiesWithVotes']==100
          assert data['spotChecksAllMatch'] is False
          assert data['certifiedSpotcheckDiscrepancyCount']==4
          assert [r['difference'] for r in data['certifiedSpotChecks']]==[-1,-3,-3,-1]
          assert data['precinctCandidateRowsInspected']>50000
          assert data['sourceZIPSHA256']=='2fab44e9b12e03c0d88ef832c2e6dc8c569e2b020d64df06a8b551b62bbdb426'
          assert 'NOT proof every local race' in data['reconciliationInterpretation']
          print('Verified:',data['precinctCandidateRowsInspected'],'precinct source rows,',
                data['countyContestChoiceRows'],'county/contest/choice observations,',
                data['judicialContestChoiceRows'],'state judicial choice totals')
          PY
      - name: Publish only original and derived NC results under bounded safe retries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add -- data/elections/nc-2024/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: publish authentic NC precinct county and judicial vote reconciliation'
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'No force push over concurrent changes'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((3*attempt))"
          done
          exit 1
