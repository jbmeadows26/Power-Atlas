name: Collect historical Census 116th district geometry
on:
  push:
    paths:
      - 'scripts/collect_historical_districts.py'
      - '.github/workflows/collect-historical-districts.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-geometry-historical
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reader
        run: python -m pip install pyshp==2.3.1
      - name: Fetch and compact historical boundaries
        run: python scripts/collect_historical_districts.py
      - name: Rebuild and test
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish verified historical map
        run: bash scripts/publish_data.sh data/geography/districts-116.geojson data/coverage.json data/app-feed.json data/research.json data/relationships.json
