name: Collect bounded state redistricting bills and votes
on:
  push:
    paths:
      - 'scripts/collect_state_redistricting_bills.py'
      - '.github/workflows/collect-state-redistricting-bills.yml'
  workflow_dispatch:
  schedule:
    - cron: '50 10 * * 4'
permissions:
  contents: write
concurrency:
  group: atlas-state-redistricting-bill-search
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query no-key bounded bill candidate search and recorded votes
        run: python scripts/collect_state_redistricting_bills.py
      - name: Refresh and validate published data
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish compact bill and vote index
        run: bash scripts/publish_data.sh data/legislation/state-redistricting-bills.json data/legislation/state-redistricting-votes.json data/coverage.json data/app-feed.json data/relationships.json data/research.json
