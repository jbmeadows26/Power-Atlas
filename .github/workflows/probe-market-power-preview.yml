name: Probe review-only Power Atlas preview routes
on:
  push:
    branches: [review/market-power-20261110]
    paths: ['.github/workflows/probe-market-power-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the public preview renders both interactive evidence pages
        env:
          PREVIEW: https://power-atlas-research-6sj76l9fm-jbmeadows26s-projects.vercel.app
        run: |
          set -euo pipefail
          check () {
            path="$1"
            expected="$2"
            code=$(curl -sS -L --retry 1 --max-time 18 -o /tmp/atlas-response -w '%{http_code}' "$PREVIEW/$path")
            echo "$path: HTTP $code; $(wc -c < /tmp/atlas-response) bytes"
            if [ "$code" != "200" ]; then echo "Review route is unavailable: $path" >&2; exit 1; fi
            if ! grep -Fq "$expected" /tmp/atlas-response; then echo "Expected review content missing from $path" >&2; exit 1; fi
          }
          check "index.html" "How big is a trillion? Who controls it?"
          check "redesign-preview.html" 'href="money-scale.html"'
          check "market-power.html" 'id="household-bridge"'
          check "market-power.html" 'market-power-household.js'
          check "market-power-household.js" "addEventListener"
          check "household-market-bridge.json" "power-atlas.market-power.household-bridge.v1"
          check "money-scale.html" 'data-group="annual-output"'
          check "money-scale.json" 'power-atlas.money-scale.v1'
          check "money-scale-review.html" 'data-group="annual-output"'
          echo "Review routes verified; no production deployment or merge performed."
