name: Validate Cost Gap
on:
  push:
    branches: [main, "feature/cost-gap-20261110", "review/visual-atlas-platform-20261110"]
    paths:
      - "platform/unified/cost-gap*"
      - "platform/unified/my-life.html"
      - "platform/unified/index.html"
      - "site/index.html"
      - "tests/test_cost_gap.py"
      - "tests/cost-gap-dom-smoke.cjs"
      - ".github/workflows/validate-cost-gap.yml"
  pull_request:
    paths:
      - "platform/unified/cost-gap*"
      - "platform/unified/my-life.html"
      - "platform/unified/index.html"
      - "site/index.html"
      - "tests/test_cost_gap.py"
      - "tests/cost-gap-dom-smoke.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify source, navigation, syntax and DOM
        run: python -m unittest discover -s tests -p "test_cost_gap.py" -v
      - name: Run full repository regression suite against the feature commit
        run: python -m unittest discover -s tests -p "test_*.py" -q
