name: Validate compact evidence
on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: git diff --exit-code -- data/research.json
