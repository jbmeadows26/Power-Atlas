name: Collect official FEC PAC party financial summaries
on:
  push:
    paths:
      - 'scripts/collect_fec_pac_summaries.py'
      - 'tests/test_institutional_decay_dashboard.py'
      - '.github/workflows/collect-fec-pac-summaries.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 09 * * 5'
permissions:
  contents: write
concurrency:
  group: atlas-fec-pac-cycle-summary
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract relevant small official federal PAC/party summaries
        run: python scripts/collect_fec_pac_summaries.py
      - name: Integrate and validate source summaries
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish compact official finance data
        run: bash scripts/publish_data.sh data/finance/fec-pac-party-summaries.json data/app-feed.json data/coverage.json data/research.json data/relationships.json
