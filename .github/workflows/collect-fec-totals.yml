name: Collect FEC committee cycle totals
on:
  push:
    paths:
      - 'scripts/collect_fec_totals.py'
      - '.github/workflows/collect-fec-totals.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 11 * * 4'
permissions:
  contents: write
concurrency:
  group: atlas-main-writes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch compact committee summary data
        run: python scripts/collect_fec_totals.py
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      - name: Refresh unified research feed
        run: python scripts/build.py
      - name: Publish with bounded rebase retries
        run: bash scripts/publish_data.sh data/finance/fec-totals.json data/app-feed.json data/research.json data/relationships.json
