name: Validate economic fragility review
on:
  pull_request:
    paths:
      - 'data/economic-fragility/**'
      - 'site/data/economic-fragility/**'
      - 'site/economic-fragility.html'
      - 'site/index.html'
      - 'platform/unified/index.html'
      - 'platform/unified/my-life.html'
      - 'platform/unified/economic-fragility-review.html'
      - 'tests/test_economic_fragility_review.py'
      - 'tests/test_economic_fragility_publication.py'
      - '.github/workflows/validate-economic-fragility-review.yml'
  workflow_dispatch:
jobs:
  review-guardrails:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate research and publication safeguards
        run: |
          python -m unittest discover -s tests -p 'test_economic_fragility_review.py' -v
          python -m unittest discover -s tests -p 'test_economic_fragility_publication.py' -v
          python -m unittest discover -s tests -p 'test_visual_atlas_market_release.py' -v
      - name: Validate inline browser script syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Extract(HTMLParser):
              def __init__(self): super().__init__(); self.in_script=False; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script" and not dict(attrs).get("src"): self.in_script=True
              def handle_endtag(self,tag):
                  if tag=="script": self.in_script=False
              def handle_data(self,data):
                  if self.in_script: self.parts.append(data)
          for path in ("platform/unified/economic-fragility-review.html","site/economic-fragility.html"):
              p=Extract();p.feed(Path(path).read_text())
              Path("/tmp/"+Path(path).stem+".js").write_text("\n".join(p.parts))
          PY
          node --check /tmp/economic-fragility-review.js
          node --check /tmp/economic-fragility.js
