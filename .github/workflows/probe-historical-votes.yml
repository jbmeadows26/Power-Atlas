name: Probe official historical congressional vote XML
on:
  push:
    paths:
      - 'scripts/probe_historical_vote_sources.py'
      - '.github/workflows/probe-historical-votes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official sources and Voteview fallbacks without saving member voting data
        run: python scripts/probe_historical_vote_sources.py
