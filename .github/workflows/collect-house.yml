name: Ingest US House 2010-2024 party vote summaries
on:
  push:
    paths:
      - 'scripts/collect_house_results.py'
      - '.github/workflows/collect-house.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 6 1 * *'
permissions:
  contents: write
concurrency:
  group: atlas-write-main
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate year partitions
        run: python scripts/collect_house_results.py
      - name: Build compact frontend data feed
        run: python scripts/build.py
      - name: Verify schema and links
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit changed data only
        run: |
          git add data/elections/house-districts.json data/app-feed.json data/research.json data/relationships.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: House district-level party vote summaries"
            git push
          fi
