name: Probe official Census state finance time series
on:
  push:
    paths:
      - 'scripts/probe_census_state_timeseries_zip.py'
      - '.github/workflows/probe-state-finance-timeseries.yml'
  pull_request:
    paths:
      - 'scripts/probe_census_state_timeseries_zip.py'
      - '.github/workflows/probe-state-finance-timeseries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official free time-series ZIP without API access
        run: python -m scripts.probe_census_state_timeseries_zip
