name: Eastern Axis | Pages desktop/mobile browser QA
on:
  push:
    branches:
      - 'migration/eastern-axis-pages-free'
    paths:
      - '.github/workflows/eastern-axis-pages-browser-qa.yml'
      - 'eastern-axis/scripts/pages_browser_qa.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Eastern Axis frontend
        working-directory: eastern-axis
        run: npm install --no-audit --no-fund
      - name: Compile Pages site pointing only to live Neon API
        working-directory: eastern-axis
        env:
          VITE_EA_TARGET: github-pages
        run: |
          export VITE_EA_API_ORIGIN="$(cat public-api-origin.txt)"
          npx vite build --base ./
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/ea-preview.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/ea-preview.log; exit 1
      - name: Install free browser QA tools
        run: |
          mkdir -p "$RUNNER_TEMP/ea-browser"
          npm install --prefix "$RUNNER_TEMP/ea-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/ea-browser/node_modules/.bin/playwright" install chromium
      - name: Audit real backend-powered interactions on desktop and mobile
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ea-browser/node_modules/playwright
        run: |
          mkdir -p audit-output
          node eastern-axis/scripts/pages_browser_qa.cjs
      - name: Retain screenshots from QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eastern-axis-pages-browser-qa
          path: audit-output/
          retention-days: 7
          if-no-files-found: warn
