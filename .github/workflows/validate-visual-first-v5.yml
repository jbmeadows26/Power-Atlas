name: Validate Power Atlas visual-first v5 review
on:
  push:
    branches:
      - design/visual-first-progressive-v5-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-first-review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source-preserving visual, route, chart and interaction contracts
        run: python -m unittest discover -s tests -p 'test_visual_first_v5.py' -v
