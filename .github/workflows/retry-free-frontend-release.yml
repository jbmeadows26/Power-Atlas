name: Validate free-tier Vercel UI release prerequisites
# Deliberately manual-only: site/vercel.json disables automatic Git deployments.
# A Git push cannot release production; use one permitted Vercel API deployment
# after the Hobby daily quota resets, then verify READY + alias + served HTML.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-release-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-backed UI and data contracts before manual release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path('site/index.html').read_text(encoding='utf-8')
          assert 'data-tab="gridlock"' in html
          d = json.loads(Path('data/hyperpartisanship/app-summary-v1.json').read_text())
          assert d['schema'] == 'power-atlas.hyperpartisanship.app-summary.v1'
          assert d['coverage']['observedCompletedChamberCongresses'] >= 30
          assert d['coverage'].get('billClassified119', d['coverage'].get('classifiedBills119', 0)) > 10000
          vercel = json.loads(Path('site/vercel.json').read_text())
          assert vercel['git']['deploymentEnabled'] is False
          print('Validated source-backed frontend; manual Vercel production deployment still required.')
          PY
          python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Explicitly report release is not performed by this workflow
        run: |
          echo 'No Git push, no Vercel API request, no deployment created.'
          echo 'After the free quota resets, create ONE manual production deployment from validated main.'
          echo 'Verify deployed SHA, READY state, alias, and served site/index.html before marking production current.'
