name: Product acceptance and visual-story regression
on:
  push:
    paths:
      - 'platform/unified/**'
      - 'data/health/sitewide-*.json'
      - 'data/housing/market-asking-rent-*.json'
      - 'data/affordability/**'
      - 'data/consumer-practices/**'
      - 'data/consumer-class-actions/**'
      - 'data/market-power/**'
      - 'data/place-impact/life-issues-v1.json'
      - 'tests/test_product_acceptance.py'
      - 'scripts/qa_browser_smoke.py'
      - '.github/workflows/validate-product-acceptance.yml'
  pull_request:
    paths:
      - 'platform/unified/**'
      - 'data/health/sitewide-*.json'
      - 'data/housing/market-asking-rent-*.json'
      - 'data/affordability/**'
      - 'data/consumer-practices/**'
      - 'data/consumer-class-actions/**'
      - 'data/market-power/**'
      - 'data/place-impact/life-issues-v1.json'
      - 'tests/test_product_acceptance.py'
      - 'scripts/qa_browser_smoke.py'
      - '.github/workflows/validate-product-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify source-backed journeys, V6 loading, discovery, and open gaps
        run: python -m unittest discover -s tests -p 'test_product_acceptance.py' -v
      - name: Validate market asking-rent evidence and reject HUD substitution
        run: python -m unittest discover -s tests -p 'test_market_rent_accuracy.py' -v
      - name: Verify local poverty guideline versus basic needs comparison
        run: python -m unittest discover -s tests -p 'test_basic_needs_gap.py' -v
      - name: Check interactive presentation scripts parse
        run: |
          node --check platform/unified/qa-evidence-hub.js
          node --check platform/unified/atlas-visual-system.js
          node --check platform/unified/visual-first-v5.js
          node --check platform/unified/visual-story-v6.js
          node --check platform/unified/market-rent-primary.js
          node --check platform/unified/basic-needs-gap.js
          node --check platform/unified/qa-monitor.js
          node --check platform/unified/api/qa-config.js
          node --check platform/unified/hud-safmr-fy2026.js
      - name: Check that redesigns never break local links or evidence pointers
        run: python scripts/audit_power_atlas_site.py --fail-on-broken-assets
      - name: Install free Chromium QA runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium --with-deps
      - name: Run real-browser ZIP, mobile, evidence and civic action journeys
        run: |
          python -m http.server 8765 --directory platform/unified > /tmp/power-atlas-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          python scripts/qa_browser_smoke.py
      - name: Publish browser QA screenshots if tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: power-atlas-qa-mobile-screenshots
          path: /tmp/power-atlas-qa/
          if-no-files-found: ignore
