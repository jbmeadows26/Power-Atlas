name: Audit Power Atlas research completion gates
on:
  push:
    paths:
      - 'scripts/build_completion_gates.py'
      - 'data/coverage.json'
      - 'data/legislation/state-redistricting-pagination.json'
      - 'data/legislation/state-redistricting-jurisdictions.json'
      - 'data/legislation/wa-2023-24-rollcalls/source-rollcalls.json'
      - '.github/workflows/build-completion-gates.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 12 * * 1,3,5'
permissions:
  contents: write
concurrency:
  group: atlas-verified-research-completion-gates
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive verified-source completion gates without external requests
        run: python scripts/build_completion_gates.py
      - name: Validate explicit national completeness thresholds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('data/health/completion-gates.json').read_text())
          assert j['schema']=='power-atlas.completion-gates.v1'
          coverage=json.loads(Path('data/coverage.json').read_text())['coverage']
          pages=json.loads(Path('data/legislation/state-redistricting-pagination.json').read_text())
          assert j['foundationalPersistedCounts']['billCandidates']==coverage['stateBillCandidateRows']
          assert j['foundationalPersistedCounts']['billCandidates']==pages['candidateBillRows']
          assert j['foundationalPersistedCounts']['sourceAttributedRelationships']==coverage['relationshipRecords']
          assert j['foundationalPersistedCounts']['federalCourtAppointments']==coverage['federalJudicialAppointments']
          assert j['foundationalPersistedCounts']['officialFECsummaries']==coverage['FECpacPartyCycleSummaryRows']
          assert len({x['id'] for x in j['gates']})==len(j['gates'])
          assert j['foundationalPersistedCounts']['officialFECsummaries']>=100
          assert any(x['id']=='state_certified_election_canvasses' for x in j['gates'])
          assert any(x['id']=='causal_decision_graph' for x in j['gates'])
          assert j['disposition']!='complete', 'Must not claim research is fully complete'
          PY
      - name: Publish audit without discarding other data
        run: bash scripts/publish_data.sh data/health/completion-gates.json
