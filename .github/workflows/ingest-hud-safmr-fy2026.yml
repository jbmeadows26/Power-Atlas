name: Ingest official HUD FY2026 Small Area Fair Market Rents
on:
  push:
    paths:
      - 'scripts/ingest_hud_safmr_fy2026.py'
      - 'tests/test_hud_safmr_ingestion.py'
      - '.github/workflows/ingest-hud-safmr-fy2026.yml'
  pull_request:
    paths:
      - 'scripts/ingest_hud_safmr_fy2026.py'
      - 'tests/test_hud_safmr_ingestion.py'
      - '.github/workflows/ingest-hud-safmr-fy2026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: power-atlas-hud-fy2026-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fetch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify parsing, identity, validation, and UI wiring
        run: python -m unittest discover -s tests -p 'test_hud_safmr_ingestion.py' -v
      - name: Collect FY2026 source records with checked pagination
        run: python scripts/ingest_hud_safmr_fy2026.py
      - name: Verify downloaded shard totals and bedroom measures
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('data/housing')
          full=json.loads((root/'hud-safmr-fy2026-v1.json').read_text())
          slices=[json.loads((root/('hud-safmr-fy2026-'+p+'.json')).read_text()) for p in '0123456789']
          assert full['fiscalYear']==2026
          assert sum(len(s['rows']) for s in slices)==len(full['rows'])
          assert len(full['rows'])>=1000
          assert len({(r['zip'],r['hudCode']) for r in full['rows']})==len(full['rows'])
          assert all(r['usdByBedroom']['1']>0 and r['usdByBedroom']['2']>0 for r in full['rows'])
          print('Verified HUD relations:',len(full['rows']))
          PY
      - name: Publish verified archived benchmarks when on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "power-atlas-hud-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/housing/hud-safmr-fy2026-*.json
          if git diff --cached --quiet; then
            echo "HUD FY2026 snapshot unchanged"
            exit 0
          fi
          prior="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$prior" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Source branch advanced; prevent overwriting newer publication."
            exit 0
          fi
          git commit -m "data(housing): publish verified HUD FY2026 ZIP-bedroom benchmark snapshot"
          git push origin HEAD:main
