name: Collect bounded FEC committee disbursements
on:
  push:
    paths:
      - 'scripts/collect_fec_transactions.py'
      - '.github/workflows/collect-fec-transactions.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 10 * * 3'
permissions:
  contents: write
concurrency:
  group: atlas-fec-transactions
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect identified FEC committee-to-committee payments
        run: python scripts/collect_fec_transactions.py
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      - name: Refresh unified research feed
        run: python scripts/build.py
      - name: Commit minimal financial data
        run: |
          git add data/finance/fec-disbursements.json data/app-feed.json data/research.json data/relationships.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "data: FEC committee transfer records"
            git push
          fi
