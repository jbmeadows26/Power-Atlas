name: Eastern Axis country data completeness audit
on:
  push:
    branches: [main]
    paths:
      - "eastern-axis/tests/liveSystemHealth.mjs"
      - ".github/workflows/eastern-axis-country-data-health.yml"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "eastern-axis/backend/globalSystems.ts"
      - "eastern-axis/backend/socialSources.ts"
      - "eastern-axis-osint/backend/globalSystems.ts"
      - "eastern-axis-osint/backend/socialSources.ts"
      - "eastern-axis/tests/socialSources.test.mjs"
      - "eastern-axis/tests/liveSystemHealth.mjs"
      - ".github/workflows/eastern-axis-country-data-health.yml"
permissions:
  contents: read
jobs:
  parser-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check official OWID schema and source isolation
        run: node --experimental-strip-types --test eastern-axis/tests/socialSources.test.mjs
      - name: Fail closed if country health probe uses an archived or untrusted API
        run: |
          node eastern-axis/tests/liveSystemHealth.mjs --check-config
          node eastern-axis/tests/liveSystemHealth.mjs --test-gini
          if EASTERN_AXIS_BASE_URL=https://retired.invalid node eastern-axis/tests/liveSystemHealth.mjs --check-config; then
            echo "Untrusted API origin was accepted" >&2
            exit 1
          fi
      - name: Build primary country dashboards
        run: cd eastern-axis && npm install --no-audit --no-fund && npm run build
      - name: Build OSINT country dashboards
        run: cd eastern-axis-osint && npm install --no-audit --no-fund && npm run build
  live-data-integrity:
    # Read-only real Neon checks on PR, push, manual and schedule; no false all-clear.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail if country cards silently lose data
        run: node eastern-axis/tests/liveSystemHealth.mjs
