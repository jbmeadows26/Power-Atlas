name: Verify Power Atlas constituent Take Action
on:
  push:
    branches:
      - feature/constituent-take-action-20261111
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  civic-action:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify civic lookup and privacy-by-design gates
        run: python -m unittest discover -s tests -p 'test_take_action.py' -v
      - name: Verify single shared Power Atlas navigation
        run: python -m unittest discover -s tests -p 'test_visual_design_shell.py' -v
