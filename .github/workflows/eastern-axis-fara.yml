name: Eastern Axis | DOJ FARA active registrant snapshot

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eastern-axis-fara.yml'
      - 'eastern-axis-osint/scripts/update_fara_snapshot.py'

permissions:
  contents: write

concurrency:
  group: eastern-axis-fara-official-source
  cancel-in-progress: false

jobs:
  update-fara:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Fetch and validate official DOJ active register (one request per run)
        run: python3 eastern-axis-osint/scripts/update_fara_snapshot.py
      - name: Commit source-verified snapshot if updated
        run: |
          if git diff --quiet -- eastern-axis-osint/backend/faraSnapshot.json; then
            echo "FARA source unchanged; existing snapshot preserved."
            exit 0
          fi
          git config user.name 'Eastern Axis Source Collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eastern-axis-osint/backend/faraSnapshot.json
          git commit -m "data(eastern-axis): refresh verified DOJ FARA active registrants"
          git push origin HEAD:main
