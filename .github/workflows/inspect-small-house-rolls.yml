name: Explain rejected official House XML vote shapes
on:
  push:
    paths:
      - 'scripts/inspect_small_official_house_rolls.py'
      - '.github/workflows/inspect-small-house-rolls.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-house-vote-shape
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose bounded 2025 official House XML parsing
        run: python scripts/inspect_small_official_house_rolls.py
      - name: Publish count-only validation details
        run: bash scripts/publish_data.sh data/health/official-house-vote-shape-diagnostics.json
