name: Browser acceptance - Power Atlas financial scale and market power
on:
  push:
    branches: [release/money-market-current-main-20261110, main]
    paths:
      - 'tests/browser_money_market_release.py'
      - '.github/workflows/browser-money-market-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Set up free headless browser
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Serve the protected unified preview's exact source locally
        run: |
          python -m http.server 8765 --directory platform/unified --bind 127.0.0.1 >/tmp/unified-preview-server.log 2>&1 &
          for n in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break || sleep 1
          done
      - name: Check clickable charts and responsive layouts at 375 and 1280 pixels
        run: python tests/browser_money_market_release.py
        env:
          POWER_ATLAS_RESEARCH_PREVIEW: https://power-atlas-research-97pivdfjl-jbmeadows26s-projects.vercel.app
          POWER_ATLAS_UNIFIED_PREVIEW: http://127.0.0.1:8765
