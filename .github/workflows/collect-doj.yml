name: Collect official DOJ Section 2 case index
on:
  push:
    paths:
      - 'scripts/collect_doj.py'
      - 'scripts/build.py'
      - '.github/workflows/collect-doj.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1,4'
permissions:
  contents: write
concurrency:
  group: atlas-doj-ingest
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch compact DOJ index
        run: python scripts/collect_doj.py
      - name: Merge and validate compact export
        run: python scripts/build.py
      - name: Commit changed dataset only
        run: |
          if ! git diff --quiet -- data/batches/doj-auto.json data/research.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/batches/doj-auto.json data/research.json
            git commit -m "data: incremental DOJ Section 2 index refresh"
            git push
          else
            echo "No source changes; no commit."
          fi
