name: Collect official DOJ Section 2 case index
on:
  push:
    paths:
      - 'scripts/collect_doj.py'
      - 'scripts/build.py'
      - '.github/workflows/collect-doj.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1,4'
permissions:
  contents: write
concurrency:
  group: atlas-doj-cases
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch compact DOJ index
        run: python scripts/collect_doj.py
      - name: Merge and validate compact export
        run: python scripts/build.py
      - name: Publish with bounded rebase retries
        run: bash scripts/publish_data.sh data/batches/doj-auto.json data/research.json data/relationships.json data/app-feed.json
