name: Free model gateway validation
on:
  pull_request:
    paths:
      - '.github/actions/free-model/**'
      - '.github/workflows/free-model-gateway.yml'
      - 'tests/test_free_model_gateway.py'
  workflow_dispatch:
    inputs:
      hosted:
        description: Allow hosted inference on a synthetic public test prompt
        type: boolean
        default: false
  schedule:
    - cron: '37 9 * * 1'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p test_free_model_gateway.py -v
      - if: github.event_name != 'pull_request'
        run: python3 .github/actions/free-model/gateway.py --catalog --output "$RUNNER_TEMP/catalog.json"
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: free-model-catalog
          path: ${{ runner.temp }}/catalog.json
          retention-days: 7
  live:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: printf '%s\n' 'Respond with the word READY.' > "$RUNNER_TEMP/free-prompt.txt"
      - uses: ./.github/actions/free-model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_FREE_PLAN_CONFIRMED: ${{ vars.GROQ_FREE_PLAN_CONFIRMED }}
          GEMINI_FREE_PLAN_CONFIRMED: ${{ vars.GEMINI_FREE_PLAN_CONFIRMED }}
          CLOUDFLARE_FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED }}
        with:
          prompt-file: ${{ runner.temp }}/free-prompt.txt
          output: ${{ runner.temp }}/free-result.json
          allow-hosted: ${{ inputs.hosted }}
          profile: extraction
      - run: python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["status"]=="ok" and d["text"].strip(); print(d["provider"], d["model"])' "$RUNNER_TEMP/free-result.json"
