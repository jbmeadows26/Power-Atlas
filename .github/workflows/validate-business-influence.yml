name: Validate business influence evidence
on:
  push:
    paths:
      - 'data/business-influence/evidence-v1.json'
      - 'data/business-influence/federal-contract-transactions-v1.json'
      - 'data/business-influence/geo-pac-fec-summary-v1.json'
      - 'data/business-influence/geo-pac-candidate-disbursements-v1.json'
      - 'scripts/collect_business_federal_awards.py'
      - 'scripts/collect_geo_pac_fec.py'
      - 'tests/test_business_federal_awards.py'
      - 'tests/test_geo_pac_fec.py'
      - 'platform/unified/business-influence.html'
      - 'platform/unified/index.html'
      - 'tests/test_business_influence.py'
      - '.github/workflows/validate-business-influence.yml'
  pull_request:
    paths:
      - 'data/business-influence/evidence-v1.json'
      - 'data/business-influence/federal-contract-transactions-v1.json'
      - 'data/business-influence/geo-pac-fec-summary-v1.json'
      - 'data/business-influence/geo-pac-candidate-disbursements-v1.json'
      - 'scripts/collect_business_federal_awards.py'
      - 'scripts/collect_geo_pac_fec.py'
      - 'tests/test_business_federal_awards.py'
      - 'tests/test_geo_pac_fec.py'
      - 'platform/unified/business-influence.html'
      - 'platform/unified/index.html'
      - 'tests/test_business_influence.py'
      - '.github/workflows/validate-business-influence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check business influence source evidence and navigation
        run: |
          python -m unittest discover -s tests -p 'test_business_influence.py' -v
          python -m unittest discover -s tests -p 'test_business_federal_awards.py' -v
          python -m unittest discover -s tests -p 'test_geo_pac_fec.py' -v
      - name: Check dashboard browser JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('platform/unified/business-influence.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\s*>(.*?)</script>',html,re.S)
          assert len(scripts)==1, 'Expected exactly one inline script'
          Path('/tmp/power-atlas-business-influence.js').write_text(scripts[0])
          PY
          node --check /tmp/power-atlas-business-influence.js
