name: Index current state legislators from CC0 Open States
on:
  push:
    paths:
      - 'scripts/collect_state_legislators.py'
      - '.github/workflows/collect-state-legislators.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 6 * * 2'
permissions:
  contents: write
concurrency:
  group: atlas-state-legislator-roster
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect bounded per-state public legislators
        run: python scripts/collect_state_legislators.py
      - name: Update live portable feed
        run: python scripts/build.py
      - name: Check data integrity
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish compact state rosters
        run: bash scripts/publish_data.sh data/people/state-legislators.json data/app-feed.json data/research.json data/relationships.json
