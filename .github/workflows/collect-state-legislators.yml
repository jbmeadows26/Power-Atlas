name: Index current state legislators from CC0 Open States
on:
  push:
    paths:
      - 'scripts/collect_state_legislators.py'
      - 'scripts/collect_state_executives.py'
      - 'scripts/collect_redistricting_committees.py'
      - '.github/workflows/collect-state-legislators.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 6 * * 2'
permissions:
  contents: write
concurrency:
  group: atlas-state-legislator-roster
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout openly licensed canonical source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openstates/people.git ../openstates-people
          git -C ../openstates-people sparse-checkout set data
      - name: Install safe YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Collect compact per-state office identities
        run: python scripts/collect_state_legislators.py
      - name: Index governors and state executives
        run: python scripts/collect_state_executives.py
      - name: Index redistricting and elections committee membership
        run: python scripts/collect_redistricting_committees.py
      - name: Update live portable feed
        run: python scripts/build.py
      - name: Check data integrity
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish compact state rosters
        run: bash scripts/publish_data.sh data/people/states data/people/state-legislators-index.json data/people/state-executives.json data/organizations/redistricting-committees.json data/app-feed.json data/research.json data/relationships.json
