name: Incremental 51-jurisdiction redistricting bill coverage
on:
  push:
    paths:
      - 'scripts/expand_state_bill_coverage.py'
      - 'tests/test_corpus.py'
      - 'tests/test_state_coverage_scheduler.py'
      - '.github/workflows/expand-state-bills.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 0,12 30 10 *'
permissions:
  contents: write
concurrency:
  group: atlas-state-redistricting-expansion
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight Python syntax for collector and corpus contracts
        run: python -m py_compile scripts/expand_state_bill_coverage.py tests/test_corpus.py tests/test_state_coverage_scheduler.py
      - name: Index eight remaining states using no-key bounded search
        run: python scripts/expand_state_bill_coverage.py
      - name: Rebuild, reconcile source staging, and validate unified evidence
        run: |
          python scripts/build.py
          python scripts/reconcile_evidence.py
          python scripts/build.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish source metadata, reconciliation, and checkpoint atomically
        run: bash scripts/publish_data.sh data/legislation/state-redistricting-bills.json data/legislation/state-redistricting-jurisdictions.json data/reconciliation data/app-feed.json data/coverage.json data/relationships.json data/research.json
