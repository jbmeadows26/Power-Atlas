name: Eastern Axis | Weekly connection audit

on:
  schedule:
    # Mondays 14:17 UTC: 9:17 AM EST / 10:17 AM EDT
    - cron: '17 14 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eastern-axis-weekly-audit.yml'
      - 'eastern-axis-osint/scripts/weekly_connection_audit.py'
      - 'eastern-axis-osint/scripts/weekly_browser_smoke.cjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: eastern-axis-weekly-connection-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EASTERN_AXIS_URL: https://eastern-axis-osint-unified.vercel.app
      AUDIT_OUTPUT_DIR: audit-output
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check every public API, data freshness, official sources and links
        id: connections
        continue-on-error: true
        run: python3 eastern-axis-osint/scripts/weekly_connection_audit.py
      - name: Install browser audit dependencies
        id: browser-setup
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/eastern-axis-audit" --no-save playwright@1.56.1
          "$RUNNER_TEMP/eastern-axis-audit/node_modules/.bin/playwright" install chromium
      - name: Test all sections and country scope on desktop/mobile
        id: browser
        if: steps.browser-setup.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/eastern-axis-audit/node_modules/playwright
        run: node eastern-axis-osint/scripts/weekly_browser_smoke.cjs
      - name: Record browser setup failure
        if: steps.browser-setup.outcome != 'success'
        run: |
          mkdir -p audit-output
          echo 'Could not install browser test tooling; full UI QA is unverified.' > audit-output/browser-not-run.txt
          echo '### Browser QA was not completed: installation error.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload weekly evidence report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eastern-axis-weekly-audit-${{ github.run_number }}
          path: audit-output/
          retention-days: 45
          if-no-files-found: warn
      - name: Open or update regression issue on audit failure
        if: steps.connections.outcome != 'success' || steps.browser.outcome == 'failure' || steps.browser-setup.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title='Eastern Axis weekly connection audit failure'
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Weekly connection or browser QA failed: $run_url. Check attached report artifacts for exact failing sources and freshness."
          else
            gh issue create --title "$title" --body "Weekly public connection or browser QA failed or was not completed. Review the report and exact source findings: $run_url. A network probe failure is not automatically an upstream outage."
          fi
      - name: Enforce pass/fail result
        if: always()
        run: |
          if [ "${{ steps.connections.outcome }}" != "success" ] ||
             [ "${{ steps.browser-setup.outcome }}" != "success" ] ||
             [ "${{ steps.browser.outcome }}" != "success" ]; then
            echo 'Weekly audit identified a failure or could not complete all tests. See report artifacts.' >&2
            exit 1
          fi
          echo 'Weekly API, source freshness, link and navigation QA passed.'
