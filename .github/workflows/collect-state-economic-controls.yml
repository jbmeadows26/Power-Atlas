name: Collect public BEA BLS and Census state economic controls
on:
  push:
    paths:
      - 'scripts/collect_state_economic_controls.py'
      - 'tests/test_state_economic_controls.py'
      - '.github/workflows/collect-state-economic-controls.yml'
  pull_request:
    paths:
      - 'scripts/collect_state_economic_controls.py'
      - 'tests/test_state_economic_controls.py'
      - '.github/workflows/collect-state-economic-controls.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-state-economic-controls
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic source mocks without publishing test values
        run: python -m unittest discover -s tests -p 'test_state_economic_controls.py' -v
      - name: Retrieve public BEA BLS and Census originals without API key
        run: python -m scripts.collect_state_economic_controls
      - name: Verify source identifiers 650 unique state-years and explicit endogeneity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('data/fiscal/state-timeseries/economic-controls-2012-2024.json').read_text())
          assert doc['coverage']['stateYears']==650
          assert doc['coverage']['BEAAnnualGrowthObservations']==650
          assert doc['coverage']['BLSAnnualMonthlyAverages']==650
          assert doc['coverage']['CensusCurrentYearFederalTransferShares']==650
          assert len(doc['records'])==650
          assert len({r['id'] for r in doc['records']})==650
          assert len(doc['source']['economicSourceSeries'])==10
          assert doc['source']['censusOriginalSHA256']=='888dfbb3f8eeebce01b409e4e86178ac04c596c7fc355047beef2433a9b5be48'
          assert not doc['researchReadiness']['causalModelReady']
          assert doc['researchReadiness']['federalTransferEndogeneityUnresolved']
          assert doc['causalEffect'] is None
          print('VALIDATED: 650 BEA/BLS/Census source-linked economic controls; no causal certification.')
          PY
      - name: Publish only source-linked economic control panel to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add -- data/fiscal/state-timeseries/economic-controls-2012-2024.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: stage 50-state BEA BLS and Census economic controls, marked noncausal'
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
